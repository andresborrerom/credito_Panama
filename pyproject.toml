[project]
name = "panama-fixed-income"
version = "0.1.0"
description = "Estudio de renta fija de Panamá (Latinex) — niveles actuales vs historia"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "numpy-financial>=1.0",
    "requests>=2.32",
    "tenacity>=8.5",
    "plotly>=5.22",
    "pyarrow>=16.0",
    "duckdb>=1.0",
    "streamlit>=1.36",
    "jinja2>=3.1",
]

[project.optional-dependencies]
pdf = ["weasyprint>=62.0"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.ruff]
line-length = 110
target-version = "py311"
