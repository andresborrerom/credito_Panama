name: Deploy GitHub Pages

on:
  push:
    branches: [main, claude/pensive-carson-shPap, claude/tasas-mercantil-report-Q8sFt]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # Siempre checkout de la rama donde vive el contenido completo
      # (docs/informativa/ no está en la rama default todavía).
      # Bump: redeploy con la última versión del site (operación end-to-end).
      - uses: actions/checkout@v4
        with:
          ref: claude/tasas-mercantil-report-Q8sFt
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
