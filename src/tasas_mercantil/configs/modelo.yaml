# Configuración del modelo predictivo Mercantil.
# Cambios aquí requieren bump de model_version_id (ver 07_MODELO_PREDICTIVO.md).
# Este archivo es la fuente única de verdad. El código orquesta; el YAML define.

version: "0.1.0"

target_central_bank: FED          # USA primero. Extensiones (BCV, ECB) en versiones futuras.

ventanas:
  brutos_desde: "1985-01-01"      # Volcker disinflation post-shock
  calibracion_hp:                 # Ventana fija; pesos congelados aquí
    from: "1995-01-01"
    to: "2009-12-31"
  evaluacion_walk_forward_desde: "2010-01-01"
  evaluacion_modernos_desde: "2019-01-01"     # SOFR/SR3/FedWatch reales
  pre_target_explicito_hasta: "1994-01-31"    # reportar separadamente
  horizontes_meses: [1, 3, 6, 12]

# Pesos iniciales propuestos. Se sobreescriben tras calibración en M-6.
pesos_agregacion:
  w_a: 0.55     # Pieza A — implied path SOFR + risk premium
  w_b: 0.35     # Pieza B — Taylor rule (bayesiana o regularizada)
  w_c_max: 0.10 # Pieza C — hipótesis editorial (opt-in mensual)

# Modelos rivales contra los que se reporta. El modelo Mercantil debe vencer al
# RIVAL_IMPLIED en skill rolling 24M para publicarse (fail-loud).
rivales:
  - rival_implied             # implied path SOFR puro
  - rival_fedwatch            # CME FedWatch mediano
  - rival_taylor_naive        # Taylor 1993 con coef fijos
  - rival_naive               # tasa actual proyectada plana
  - rival_dotplot_median      # mediana del SEP más reciente

# Regímenes de Fed Funds. Reportados separadamente en backtest.
regimenes:
  # Pre-2010: in-sample / training. Reportados con caveat.
  - {id: "volcker_disinflation",   from: "1985-01", to: "1987-08", evaluacion: "in_sample"}
  - {id: "greenspan_pre_target",   from: "1987-09", to: "1994-01", evaluacion: "in_sample"}
  - {id: "greenspan_post_target",  from: "1994-02", to: "2005-12", evaluacion: "in_sample"}
  - {id: "bernanke_pre_crisis",    from: "2006-01", to: "2007-12", evaluacion: "in_sample"}
  - {id: "crisis_early_qe",        from: "2008-01", to: "2009-12", evaluacion: "in_sample"}
  # Post-2010: walk-forward genuino, sin contaminación.
  - {id: "qe_zlb",                 from: "2010-01", to: "2013-04", evaluacion: "walk_forward"}
  - {id: "taper_tantrum",          from: "2013-05", to: "2014-12", evaluacion: "walk_forward"}
  - {id: "normalizacion_yellen",   from: "2015-01", to: "2018-09", evaluacion: "walk_forward"}
  - {id: "hike_powell",            from: "2018-10", to: "2019-06", evaluacion: "walk_forward"}
  - {id: "pivot_cuts",             from: "2019-07", to: "2020-02", evaluacion: "walk_forward"}
  - {id: "covid_zlb",              from: "2020-03", to: "2022-02", evaluacion: "walk_forward"}
  - {id: "hike_agresivo",          from: "2022-03", to: "2023-07", evaluacion: "walk_forward"}
  - {id: "hold",                   from: "2023-08", to: "2024-08", evaluacion: "walk_forward"}
  - {id: "cut_cycle",              from: "2024-09", to: "now",     evaluacion: "walk_forward"}

# Reglas de "fail loud" — si alguna se cumple, el modelo no se publica el corte.
fail_loud:
  skill_min_rolling24m: 0.05      # vs rival_implied
  coverage_ic80_min: 0.70
  coverage_ic80_max: 0.90
  bias_max_bps_rolling12m: 15

# Bootstrap del ranking modelo-rivales.
bootstrap:
  block_size_months: 6
  num_replicas: 1000
  seed: 42
